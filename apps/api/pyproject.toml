[project]
name = "agentworld-api"
version = "0.1.0"
description = "AgentWorld API - universal AI agent monitoring and management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # [crypto] pulls in `cryptography`, without which PyJWT silently refuses
    # RS256 and every Supabase token would fail to verify.
    "pyjwt[crypto]>=2.9.0",
    # Already present transitively through pyjwt[crypto]; named explicitly
    # because `infra/secrets/` imports AESGCM from it directly, and a
    # dependency you rely on through someone else's extra is one that can be
    # dropped by a release note you did not read.
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------- ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# TC/TCH (flake8-type-checking) is deliberately NOT selected. It wants
# annotation-only imports moved into `if TYPE_CHECKING` blocks, but FastAPI
# resolves annotations at runtime to build dependency injection and response
# models, so deferring Request/Response/FastAPI imports breaks the framework.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
# `helpers` is the integration tests' own module (a conftest cannot be
# imported from a test file, so the shared types live beside it). Without
# this, isort files it under third-party and then disagrees with itself about
# where it belongs.
known-first-party = ["agentworld", "helpers"]

# --------------------------------------------------------------------- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ------------------------------------------------------------------- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
# Fixtures share the test's own loop. The one session-scoped fixture that
# needs a longer-lived loop asks for it explicitly with `loop_scope`, because
# it creates and disposes its own engines; everything else holds connections
# that must live on the same loop as the test using them. Setting this to
# "session" globally puts function fixtures on a different loop from the test
# and asyncpg fails with "attached to a different loop".
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Postgres and Redis",
]

[tool.coverage.run]
source = ["src/agentworld"]
omit = ["*/main.py"]

# ----------------------------------------------------------- import-linter ---
# These contracts are the structural enforcement of goals G1 and G8 in
# docs/01-ARCHITECTURE.md. They exist from the first commit on purpose:
# retrofitting them later means auditing every import already written.
[tool.importlinter]
root_package = "agentworld"
# Required because the "forbidden" contracts below name external packages
# (fastapi, sqlalchemy, openai, ...). Without it import-linter refuses to run.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture - dependencies point inward only"
type = "layers"
layers = [
    "agentworld.api",
    "agentworld.services",
    "agentworld.repositories",
    "agentworld.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is framework-free and provider-free (G1)"
type = "forbidden"
source_modules = ["agentworld.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "redis",
    "httpx",
    "uvicorn",
    "openai",
    "anthropic",
    "langchain",
    "langgraph",
]

[[tool.importlinter.contracts]]
name = "Domain does not depend on infrastructure"
type = "forbidden"
source_modules = ["agentworld.domain"]
forbidden_modules = [
    "agentworld.infra",
    "agentworld.api",
    "agentworld.services",
    "agentworld.repositories",
    "agentworld.adapters",
]

[[tool.importlinter.contracts]]
name = "Adapters translate payloads and never touch persistence"
type = "forbidden"
source_modules = ["agentworld.adapters"]
forbidden_modules = [
    "agentworld.repositories",
    "agentworld.services",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
# The same shape as the rule above, for the same reason. `infra/secrets/` is
# the only module that may encrypt or decrypt credential material, so the
# AEAD primitives are not importable anywhere else - a second call site is
# a second AAD construction, and an AAD that differs by one byte from the
# one that wrote the row is an unreadable credential discovered in
# production.
name = "Only infra/secrets handles credential ciphertext"
type = "forbidden"
source_modules = [
    "agentworld.api",
    "agentworld.services",
    "agentworld.repositories",
    "agentworld.domain",
    "agentworld.adapters",
]
forbidden_modules = ["cryptography"]
# Direct imports only: `repositories.credentials` imports `EncryptedBlob`
# from `infra.secrets`, which imports `cryptography`, and the transitive
# reading of this contract would make that - the intended arrangement - a
# violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Persistence belongs in repositories. A service that reaches for `select()`
# is a service that has started doing its own querying, which is how tenant
# filters end up scattered and then forgotten.
name = "Services orchestrate; only repositories speak SQL"
type = "forbidden"
source_modules = ["agentworld.services"]
forbidden_modules = ["sqlalchemy", "asyncpg", "alembic"]
# Direct imports only. Services import repositories, and repositories import
# SQLAlchemy, so the default (transitive) reading of this contract is one no
# layered design could ever satisfy - the first run reported six violations
# that were all just "a service imports a repository". What the rule is
# actually for is a service reaching for `select()` itself.
allow_indirect_imports = true
