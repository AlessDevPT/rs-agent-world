[project]
name = "agentworld-api"
version = "0.1.0"
description = "AgentWorld API - universal AI agent monitoring and management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------- ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# TC/TCH (flake8-type-checking) is deliberately NOT selected. It wants
# annotation-only imports moved into `if TYPE_CHECKING` blocks, but FastAPI
# resolves annotations at runtime to build dependency injection and response
# models, so deferring Request/Response/FastAPI imports breaks the framework.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# --------------------------------------------------------------------- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ------------------------------------------------------------------- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs Postgres and Redis",
]

[tool.coverage.run]
source = ["src/agentworld"]
omit = ["*/main.py"]

# ----------------------------------------------------------- import-linter ---
# These contracts are the structural enforcement of goals G1 and G8 in
# docs/01-ARCHITECTURE.md. They exist from the first commit on purpose:
# retrofitting them later means auditing every import already written.
[tool.importlinter]
root_package = "agentworld"
# Required because the "forbidden" contracts below name external packages
# (fastapi, sqlalchemy, openai, ...). Without it import-linter refuses to run.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture - dependencies point inward only"
type = "layers"
layers = [
    "agentworld.api",
    "agentworld.services",
    "agentworld.repositories",
    "agentworld.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is framework-free and provider-free (G1)"
type = "forbidden"
source_modules = ["agentworld.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "redis",
    "httpx",
    "uvicorn",
    "openai",
    "anthropic",
    "langchain",
    "langgraph",
]

[[tool.importlinter.contracts]]
name = "Domain does not depend on infrastructure"
type = "forbidden"
source_modules = ["agentworld.domain"]
forbidden_modules = [
    "agentworld.infra",
    "agentworld.api",
    "agentworld.services",
    "agentworld.repositories",
    "agentworld.adapters",
]

[[tool.importlinter.contracts]]
name = "Adapters translate payloads and never touch persistence"
type = "forbidden"
source_modules = ["agentworld.adapters"]
forbidden_modules = [
    "agentworld.repositories",
    "agentworld.services",
    "sqlalchemy",
]
