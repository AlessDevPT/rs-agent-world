# Alembic configuration.
#
# Deliberately minimal: there is no sqlalchemy.url here. The database URL
# comes from `agentworld.settings`, the same place the application reads it,
# so a migration can never be applied to a different database than the one
# the app is about to talk to. See migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Zero-padded and ordered, so `ls versions/` reads as the migration history.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
