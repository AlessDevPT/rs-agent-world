name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  api:
    name: API - lint, types, architecture, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy src

      # The contracts that keep the domain layer provider-free (G1) and the
      # island deletable (G8). Note the console script: `python -m
      # importlinter.cli` exits 0 without evaluating anything, which looks
      # exactly like a pass.
      - name: Architecture contracts
        run: lint-imports

      - name: pytest
        run: pytest --cov --cov-report=term-missing

  web:
    name: Web - lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Includes the boundary rules: nothing outside world/ may import Phaser,
      # and world/projector must stay free of React and Phaser.
      - run: npm run lint --workspace apps/web

      - run: npm run typecheck --workspace apps/web

      - run: npm run test --workspace apps/web

      - run: npm run build --workspace apps/web

  compose:
    name: Local stack starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait

      - name: Both services healthy
        run: docker compose -f infra/compose/docker-compose.yml ps

      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
